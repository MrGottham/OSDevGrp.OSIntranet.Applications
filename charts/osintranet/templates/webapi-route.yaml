apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-webapi-route
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - {{ .Values.ingress.secureEntryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.deployments.webapi.ingress.host }}`)
      services:
        - name: {{ .Release.Name }}-webapi-service
          passHostHeader: true
          port: {{ .Values.deployments.webapi.containerPort }}
          scheme: http
  tls:
    secretName: {{ .Release.Name }}-tls-secret