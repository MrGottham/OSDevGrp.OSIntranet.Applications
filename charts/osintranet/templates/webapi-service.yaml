apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webapi-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.deployments.webapi.containerServiceType }}
  selector:
    app: {{ .Release.Name }}-webapi-selector
  ports:
    - port: {{ .Values.deployments.webapi.containerPort }}
      targetPort: {{ .Values.deployments.webapi.containerPort }}
      protocol: TCP
      name: {{ .Values.deployments.webapi.containerPortName }}