apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-react-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.deployments.react.containerServiceType }}
  selector:
    app: {{ .Release.Name }}-react-selector
  ports:
    - port: {{ .Values.deployments.react.containerPort }}
      targetPort: {{ .Values.deployments.react.containerPort }}
      protocol: TCP
      name: {{ .Values.deployments.react.containerPortName }}