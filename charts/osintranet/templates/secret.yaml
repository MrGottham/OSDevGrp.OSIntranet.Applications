apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
data:
  connectingStringWebApi: {{ required "settings.connectionStrings.webapi is required" .Values.settings.connectionStrings.webapi | b64enc }}
  connectingStringMvc: {{ required "settings.connectionStrings.mvc is required" .Values.settings.connectionStrings.mvc | b64enc }}
  securityJwtKeyKty: {{ required "settings.security.jwt.key.kty is required" .Values.settings.security.jwt.key.kty | b64enc }}
  securityJwtKeyN: {{ required "settings.security.jwt.key.n_value is required" .Values.settings.security.jwt.key.n_value | toString | b64enc | quote }}
  securityJwtKeyE: {{ required "settings.security.jwt.key.e_value is required" .Values.settings.security.jwt.key.e_value | b64enc }}
  securityJwtKeyD: {{ required "settings.security.jwt.key.d_value is required" .Values.settings.security.jwt.key.d_value | toString | b64enc | quote }}
  securityJwtKeyDP: {{ required "settings.security.jwt.key.dp_value is required" .Values.settings.security.jwt.key.dp_value | toString | b64enc | quote }}
  securityJwtKeyDQ: {{ required "settings.security.jwt.key.dq_value is required" .Values.settings.security.jwt.key.dq_value | toString | b64enc | quote }}
  securityJwtKeyP: {{ required "settings.security.jwt.key.p_value is required" .Values.settings.security.jwt.key.p_value | toString | b64enc | quote }}
  securityJwtKeyQ: {{ required "settings.security.jwt.key.q_value is required" .Values.settings.security.jwt.key.q_value | toString | b64enc | quote }}
  securityJwtKeyQI: {{ required "settings.security.jwt.key.qi_value is required" .Values.settings.security.jwt.key.qi_value | toString | b64enc | quote }}
  securityOidcClientIdMvc: {{ required "settings.security.oidc.mvc.clientId is required" .Values.settings.security.oidc.mvc.clientId | toString | b64enc | quote }}
  securityOidcClientSecretMvc: {{ required "settings.security.oidc.mvc.clientSecret is required" .Values.settings.security.oidc.mvc.clientSecret | toString | b64enc | quote }}
  securityOidcClientIdBff: {{ required "settings.security.oidc.bff.clientId is required" .Values.settings.security.oidc.bff.clientId | toString | b64enc | quote }}
  securityOidcClientSecretBff: {{ required "settings.security.oidc.bff.clientSecret is required" .Values.settings.security.oidc.bff.clientSecret | toString | b64enc | quote }}
  securityMicrosoftClientId: {{ required "settings.security.microsoft.clientId is required" .Values.settings.security.microsoft.clientId | toString | b64enc | quote }}
  securityMicrosoftClientSecret: {{ required "settings.security.microsoft.clientSecret is required" .Values.settings.security.microsoft.clientSecret | toString | b64enc | quote }}
  securityMicrosoftTenant: {{ required "settings.security.microsoft.tenant is required" .Values.settings.security.microsoft.tenant | toString | b64enc | quote }}
  securityGoogleClientId: {{ required "settings.security.google.clientId is required" .Values.settings.security.google.clientId | toString | b64enc | quote }}
  securityGoogleClientSecret: {{ required "settings.security.google.clientSecret is required" .Values.settings.security.google.clientSecret | toString | b64enc | quote }}
  securityAcmeChallengeWellKnownChallengeTokenWebApi: {{ required "settings.security.acmeChallenge.webapi.wellKnownChallengeToken is required" .Values.settings.security.acmeChallenge.webapi.wellKnownChallengeToken | toString | b64enc | quote }}
  securityAcmeChallengeConstructedKeyAuthorizationWebApi: {{ required "settings.security.acmeChallenge.webapi.constructedKeyAuthorization is required" .Values.settings.security.acmeChallenge.webapi.constructedKeyAuthorization | toString | b64enc | quote }}
  securityAcmeChallengeWellKnownChallengeTokenMvc: {{ required "settings.security.acmeChallenge.mvc.wellKnownChallengeToken is required" .Values.settings.security.acmeChallenge.mvc.wellKnownChallengeToken | toString | b64enc | quote }}
  securityAcmeChallengeConstructedKeyAuthorizationMvc: {{ required "settings.security.acmeChallenge.mvc.constructedKeyAuthorization is required" .Values.settings.security.acmeChallenge.mvc.constructedKeyAuthorization | toString | b64enc | quote }}