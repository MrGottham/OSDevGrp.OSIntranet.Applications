apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mvc-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.deployments.mvc.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mvc-selector
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mvc-selector
    spec:
      containers:
        - name: {{ .Release.Name }}-mvc
          image: {{ .Values.deployments.mvc.containerImage }}
          imagePullPolicy: {{ .Values.deployments.mvc.containerImagePullPolicy }}
          ports:
            - name: {{ .Values.deployments.mvc.containerPortName }}
              containerPort: {{ .Values.deployments.mvc.containerPort }}
              protocol: TCP
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: TZ
            - name: DOTNET_RUNNING_IN_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: RUNNING_IN_CONTAINER
            - name: ASPNETCORE_HTTP_PORTS
              value: {{ .Values.deployments.mvc.containerPort | quote }}
            - name: NON_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: NON_ROOT_USER
            - name: SUDO_ASKPASS
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: SUDO_ASKPASS
            - name: connectionStrings__OSIntranet
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: connectingStringMvc
            - name: Security__OIDC__Authority
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: securityOidcAuthorityMvc
            - name: Security__OIDC__ClientId
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityOidcClientIdMvc
            - name: Security__OIDC__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityOidcClientSecretMvc
            - name: Security__Microsoft__ClientId
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityMicrosoftClientId
            - name: Security__Microsoft__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityMicrosoftClientSecret
            - name: Security__Microsoft__Tenant
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityMicrosoftTenant
            - name: Security__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityGoogleClientId
            - name: Security__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityGoogleClientSecret
            - name: Security__TrustedDomainCollection
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: securityTrustedDomainCollectionMvc
            - name: Security__AcmeChallenge__WellKnownChallengeToken
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityAcmeChallengeWellKnownChallengeTokenMvc
            - name: Security__AcmeChallenge__ConstructedKeyAuthorization
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: securityAcmeChallengeConstructedKeyAuthorizationMvc
            - name: Licenses__AutoMapper__LicenseKey
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: licensesAutoMapperLicenseKey
            - name: ExternalData__Dashboard__EndpointAddress
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-configmap
                  key: externalDataDashboardEndpointAddress
          readinessProbe:
            httpGet:
              scheme: HTTP
              port: {{ .Values.deployments.mvc.containerPort }}
              path: {{ .Values.deployments.mvc.healthCheck.endpoint }}
            periodSeconds: {{ .Values.deployments.mvc.healthCheck.readinessProbe.checkInterval }}
            timeoutSeconds: {{ .Values.deployments.mvc.healthCheck.readinessProbe.timeout }}
            successThreshold: {{ .Values.deployments.mvc.healthCheck.readinessProbe.successThreshold }}
            failureThreshold:  {{ .Values.deployments.mvc.healthCheck.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              scheme: HTTP
              port: {{ .Values.deployments.mvc.containerPort }}
              path: {{ .Values.deployments.mvc.healthCheck.endpoint }}
            periodSeconds: {{ .Values.deployments.mvc.healthCheck.livenessProbe.checkInterval }}
            timeoutSeconds: {{ .Values.deployments.mvc.healthCheck.livenessProbe.timeout }}
            successThreshold: {{ .Values.deployments.mvc.healthCheck.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.deployments.mvc.healthCheck.livenessProbe.failureThreshold }}
          startupProbe:
            httpGet:
              scheme: HTTP
              port: {{ .Values.deployments.mvc.containerPort }}
              path: {{ .Values.deployments.mvc.healthCheck.endpoint }}
            periodSeconds: {{ .Values.deployments.mvc.healthCheck.startupProbe.checkInterval }}
            timeoutSeconds: {{ .Values.deployments.mvc.healthCheck.startupProbe.timeout }}
            successThreshold: {{ .Values.deployments.mvc.healthCheck.startupProbe.successThreshold }}
            failureThreshold:  {{ .Values.deployments.mvc.healthCheck.startupProbe.failureThreshold }}