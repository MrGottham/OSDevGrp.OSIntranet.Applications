apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-bff-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.deployments.bff.containerServiceType }}
  selector:
    app: {{ .Release.Name }}-bff-selector
  ports:
    - port: {{ .Values.deployments.bff.containerPort }}
      targetPort: {{ .Values.deployments.bff.containerPort }}
      protocol: TCP
      name: {{ .Values.deployments.bff.containerPortName }}